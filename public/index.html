<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Human</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
            margin: 0;
        }
        #chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 15px;
            line-height: 1.4;
        }
        .user-msg {
            background-color: #007bff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .bot-msg {
            background-color: #2a2a2a;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid #333;
        }
        #input-container {
            display: flex;
            padding: 15px;
            background-color: #1e1e1e;
        }
        input {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: #2b2b2b;
            color: #fff;
            outline: none;
        }
        button {
            margin-left: 10px;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background-color: #007bff;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="chat-container">
        <div class="message bot-msg">
            Sistem Hazır. Dijital İnsanı var etmek için ilk adımı atın. (Örn: "Kendine bir isim ve cinsiyet seç")
        </div>
    </div>

    <div id="input-container">
        <input type="text" id="userInput" placeholder="Mesajınızı yazın..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Gönder</button>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;

            const chatContainer = document.getElementById('chat-container');

            // Kullanıcı mesajını ekrana ekle
            const userDiv = document.createElement('div');
            userDiv.className = 'message user-msg';
            userDiv.innerText = message;
            chatContainer.appendChild(userDiv);

            input.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });
                const data = await response.json();

                // Bot yanıtını ekrana ekle
                const botDiv = document.createElement('div');
                botDiv.className = 'message bot-msg';
                botDiv.innerText = data.reply;
                chatContainer.appendChild(botDiv);

                chatContainer.scrollTop = chatContainer.scrollHeight;
            } catch (err) {
                console.error("Hata oluştu:", err);
            }
        }
    </script>
</body>
</html>
